version: 2

updates:
  # Production Python dependencies (requirements.txt at the repository root).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps(py)'
    # Django 5.2 is the long-term support release this project targets. A new major needs its own pass.
    ignore:
      - dependency-name: django
        update-types: [version-update:semver-major]
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  # Development tools for the backend (backend/requirements-dev.txt).
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps(py-dev)'
    # Django 5.2 is the long-term support release this project targets. A new major needs its own pass.
    ignore:
      - dependency-name: django
        update-types: [version-update:semver-major]
    groups:
      python-dev-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps(js)'
    groups:
      # typescript-eslint caps the TypeScript version it accepts, so the two have to move together.
      typescript-tooling:
        patterns: ['typescript', 'typescript-eslint', '@typescript-eslint/*']
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'

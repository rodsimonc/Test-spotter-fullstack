name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays at 05:17 UTC. New advisories land between pushes.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Scans the whole history, since a secret removed in a later commit is still leaked.
          fetch-depth: 0

      # The official action works out a commit range from the push event, and that breaks on the
      # first push of a repo (the root commit has no parent). Running the pinned binary over the
      # whole history is simpler and needs no license.
      - name: Install gitleaks
        env:
          VERSION: '8.24.3'
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz "${base}/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${VERSION}_checksums.txt"
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan the full history
        run: '"$RUNNER_TEMP/gitleaks" detect --source . --redact --verbose --exit-code 2'

  python-deps:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit requirements.txt
        run: pip-audit -r requirements.txt

  node-deps:
    name: Node dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Production dependencies only. A flaw in a test runner does not ship.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch replaces the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r backend/requirements-dev.txt

      - name: Ruff lint
        working-directory: backend
        run: ruff check .

      - name: Ruff format
        working-directory: backend
        run: ruff format --check .

      - name: Tests with coverage
        working-directory: backend
        run: >
          pytest
          --cov=apps
          --cov-report=term-missing:skip-covered
          --cov-report=xml
          --cov-fail-under=85

      # A model change without its migration passes every test and breaks the first deploy.
      - name: Migrations are up to date
        working-directory: backend
        env:
          DJANGO_DEBUG: '1'
        run: python manage.py makemigrations --check --dry-run

      - name: Make a throwaway secret key for the deploy check
        run: echo "DJANGO_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(64))')" >> "$GITHUB_ENV"

      # Production settings, minus the real secret and database.
      - name: Django deploy check
        working-directory: backend
        env:
          DJANGO_DEBUG: '0'
          DJANGO_ALLOWED_HOSTS: trips.example.com
          DATABASE_URL: sqlite:///${{ runner.temp }}/deploy-check.sqlite3
          TRUST_PROXY_HEADERS: '1'
        run: python manage.py check --deploy --fail-level WARNING

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm test -- --coverage

      - name: Type check the end-to-end suite
        run: npx tsc -p e2e/tsconfig.json

      - name: Test the fake upstream used by the end-to-end suite
        run: node --test e2e/fake-upstream/server.test.mjs

      - name: Build
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: End-to-end
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: frontend
    env:
      CI: 'true'
      # Serve the production build with its security headers, so the CSP checks run too.
      E2E_PREVIEW: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      # The suite starts Django itself, so it only needs the production dependencies.
      - name: Install backend dependencies
        working-directory: .
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Chromium and its system libraries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install system libraries only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run the end-to-end suite
        run: npx playwright test --project=chromium

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
